name: destroy
on:
  schedule:
    - cron: "30 20 * * *"   # 02:00 IST nightly
  workflow_dispatch:
permissions: { id-token: write, contents: read }
jobs:
  destroy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: sandbox-teardown
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3
        with: { terraform_version: "1.16.6", terraform_wrapper: false }
      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with: { role-to-assume: "${{ vars.TEARDOWN_ROLE_ARN }}", aws-region: "${{ vars.AWS_REGION }}" }
      - run: terraform init -input=false -backend-config="bucket=${{ vars.STATE_BUCKET }}" -backend-config="region=${{ vars.AWS_REGION }}"
        working-directory: demo
      - run: terraform destroy -input=false -auto-approve
        working-directory: demo
      - run: bash scripts/verify-teardown.sh "${{ vars.AWS_REGION }}"
